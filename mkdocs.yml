site_name: ផែនទីវិទ្យា
site_description: សៀវភៅសិក្សាផែនទីវិទ្យាជាភាសាខ្មែរ សម្រាប់វគ្គសិក្សា ១ ឆមាស
site_author: YAM Sarath (យាំ សារដ្ឋ)
site_url: https://khgeo.github.io/cartography/
repo_url: https://github.com/khgeo/cartography
repo_name: cartography
edit_uri: edit/main/docs/
copyright: CC BY-SA 4.0 · អាចប្រើ និងកែសម្រួលបាន ដោយដកស្រង់ប្រភព

theme:
  name: material
  language: en          # Material has no Khmer UI pack; content is Khmer
  font: false           # disable Google Fonts CDN; we load Khmer fonts in CSS
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: ប្ដូរទៅរបៀបងងឹត
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: ប្ដូរទៅរបៀបភ្លឺ

extra_css:
  - https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Siemreap&family=Moul&display=swap
  - assets/css/khmer.css
  - https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css
  - assets/css/workbook.css
  - assets/css/lesson-sims.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js
  - assets/js/carto-sims.js
  - assets/js/lesson-sims.js
  - assets/js/workbook.js

markdown_extensions:
  - admonition
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.snippets:
      base_path: [docs]
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: "¶"
      toc_depth: 3

plugins:
  - search

extra:
  homepage: https://khgeo.github.io/
  social:
    - icon: material/bookshelf
      link: https://khgeo.github.io/
      name: ស៊េរីសៀវភៅទាំង ៤


nav:
  - ទំព័រដើម: index.md
  - កម្មវិធីសិក្សា: syllabus.md
