<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" role="img" class="km-fig"><style>.km-fig{width:100%;height:auto}.km-fig text{font-family:var(--km-stack,'Battambang',sans-serif);fill:var(--md-default-fg-color,#222)}.km-t{font-size:15px;font-weight:700}.km-s{font-size:12.5px}.km-xs{font-size:11px}.km-box{fill:none;stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.5}.km-hdr{fill:var(--md-primary-fg-color,#00897b);opacity:.14}.km-line{stroke:var(--md-primary-fg-color,#00897b);stroke-width:1.4;stroke-dasharray:4 3;fill:none}.km-pt{fill:var(--md-primary-fg-color,#00897b)}.km-land{fill:var(--md-default-fg-color--lightest,#eee)}.km-arr{stroke:var(--md-default-fg-color--light,#666);stroke-width:1.6;fill:none;marker-end:url(#ah)}.km-ok{fill:#2e7d32}.km-bad{fill:#c62828}.km-mono{font-family:monospace!important;font-size:11.5px}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#777"/></marker></defs><text class="km-s" x="20" y="24" text-anchor="start" font-weight="700">លំដាប់អាទិភាពនៃទីតាំងស្លាកសម្រាប់ចំណុច</text><circle cx="150" cy="120" r="5" fill="#212121" stroke="none" stroke-width="1.5" opacity="1"/><rect class="" x="168" y="102" width="44" height="16" rx="2" style="fill:#e8eaf6;stroke:#9fa8da"/><text class="km-xs" x="190" y="114" text-anchor="middle" font-weight="700">១</text><rect class="" x="88" y="102" width="44" height="16" rx="2" style="fill:#e8eaf6;stroke:#9fa8da"/><text class="km-xs" x="110" y="114" text-anchor="middle" font-weight="700">២</text><rect class="" x="168" y="126" width="44" height="16" rx="2" style="fill:#e8eaf6;stroke:#9fa8da"/><text class="km-xs" x="190" y="138" text-anchor="middle" font-weight="700">៣</text><rect class="" x="88" y="126" width="44" height="16" rx="2" style="fill:#e8eaf6;stroke:#9fa8da"/><text class="km-xs" x="110" y="138" text-anchor="middle" font-weight="700">៤</text><rect class="" x="130" y="84" width="44" height="16" rx="2" style="fill:#e8eaf6;stroke:#9fa8da"/><text class="km-xs" x="152" y="96" text-anchor="middle" font-weight="700">៥</text><rect class="" x="130" y="144" width="44" height="16" rx="2" style="fill:#e8eaf6;stroke:#9fa8da"/><text class="km-xs" x="152" y="156" text-anchor="middle" font-weight="700">៦</text><text class="km-xs" x="20" y="200" text-anchor="start">① ស្ដាំលើ ជាទីតាំងអាទិភាពទី១ សម្រាប់អក្សរឡាតាំង និងខ្មែរ</text><text class="km-xs" x="20" y="222" text-anchor="start">ស្លាកមិនគួរជាន់លើចំណុច ព្រំដែន ឬស្លាកផ្សេង</text><text class="km-xs" x="20" y="244" text-anchor="start">ស្លាកបន្ទាត់ (ទន្លេ ផ្លូវ) ដាក់តាមខ្សែ (curved) និងធ្វើម្ដងទៀតបើវែង</text><text class="km-xs" x="20" y="266" text-anchor="start">ស្លាកផ្ទៃដាក់កណ្ដាល ឬតាមរូបរាងផ្ទៃ</text><rect class="" x="400" y="50" width="330" height="110" rx="4" style="fill:#8d9f7a;stroke:#7a8c68"/><text class="km-xs" x="420" y="95" text-anchor="start" style="fill:#fff">គ្មានស្រទាប់ស៖</text><text class="km-s" x="420" y="125" fill="#1b1b1b">កំពង់ឆ្នាំង</text><text class="km-xs" x="580" y="95" text-anchor="start" style="fill:#fff">មានស្រទាប់ស៖</text><text class="km-s" x="580" y="125" stroke="#ffffff" stroke-width="3.2" paint-order="stroke" fill="#1b1b1b">កំពង់ឆ្នាំង</text><text class="km-xs" x="400" y="180" text-anchor="start">ស្រទាប់ស (halo · buffer) ០,៨ ដល់ ១ មម ធ្វើឲ្យអក្សរអានបានលើផ្ទៃពណ៌</text><path d="M400 235 C460 205 520 265 600 230 S700 210 730 230" fill="none" stroke="#64b5f6" stroke-width="6" opacity="1"/><g transform="translate(452 222) rotate(-9)"><text class="km-xs" x="0" y="0" stroke="#ffffff" stroke-width="3" paint-order="stroke" fill="#0d47a1">ទន្លេសាប</text></g><g transform="translate(628 218) rotate(-4)"><text class="km-xs" x="0" y="0" stroke="#ffffff" stroke-width="3" paint-order="stroke" fill="#0d47a1">ទន្លេសាប</text></g><text class="km-xs" x="400" y="285" text-anchor="start">ស្លាកកោងតាមខ្សែទន្លេ ជួយឲ្យអ្នកអានដឹងថាស្លាកសំដៅលើអ្វី</text></svg>
