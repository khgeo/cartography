79 350 119" fill="none" stroke="#a1724a" stroke-width="1" opacity="1"/><path d="M280 153 L280 53" fill="none" stroke="#4a90d9" stroke-width="2.5" opacity="1"/><text class="km-s" x="280" y="190" text-anchor="middle" font-weight="700">ជ្រលង</text><text class="km-xs" x="280" y="208" text-anchor="middle">V ចង្អុលទៅដើមទឹក</text><path d="M390 125 Q460 65 530 125" fill="none" stroke="#8a5a33" stroke-width="1.6" opacity="1"/><path d="M390 143 Q460 83 530 143" fill="none" stroke="#a1724a" stroke-width="1" opacity="1"/><path d="M390 161 Q460 101 530 161" fill="none" stroke="#a1724a" stroke-width="1" opacity="1"/><path d="M390 179 Q460 119 530 179" fill="none" stroke="#a1724a" stroke-width="1" opacity="1"/><text class="km-s" x="460" y="190" text-anchor="middle" font-weight="700">ជួរភ្នំ</text><text class="km-xs" x="460" y="208" text-anchor="middle">V ចង្អុលចុះក្រោម</text><path d="M580 55 L585 145" fill="none" stroke="#a1724a" stroke-width="1" opacity="1"/><path d="M583 55 L588 145" fill="none" stroke="#a1724a" stroke-width="1" opacity="1"/><path d="M586 55 L591 145" fill="none" stroke="#a1724a" stroke-width="1" opacity="1"/><path d="M589 55 L594 145" fill="none" stroke="#a1724a" stroke-width="1" opacity="1"/><path d="M592 55 L597 145" fill="none" stroke="#a1724a" stroke-width="1" opacity="1"/><path d="M595 55 L600 145" fill="none" stroke="#a1724a" stroke-width="1" opacity="1"/><path d="M598 55 L603 145" fill="none" stroke="#a1724a" stroke-width="1" opacity="1"/><path d="M650 55 L654 145" fill="none" stroke="#a1724a" stroke-width="1" opacity="1"/><path d="M668 55 L672 145" fill="none" stroke="#a1724a" stroke-width="1" opacity="1"/><path d="M686 55 L690 145" fill="none" stroke="#a1724a" stroke-width="1" opacity="1"/><path d="M704 55 L708 145" fill="none" stroke="#a1724a" stroke-width="1" opacity="1"/><text class="km-s" x="600" y="190" text-anchor="middle" font-weight="700">ចោត</text><text class="km-s" x="685" y="190" text-anchor="middle" font-weight="700">រាប</text><text class="km-xs" x="640" y="208" text-anchor="middle">ខ្សែជិត ↔ ខ្សែឆ្ងាយ</text><text class="km-xs" x="30" y="215" text-anchor="start">• ខ្សែវណ្ឌមិនកាត់គ្នា និងមិនបំបែកគ្នា</text><text class="km-xs" x="30" y="232" text-anchor="start">• ខ្សែវណ្ឌបិទជុំវិញខ្លួនឯង (អាចចេញក្រៅផែនទី)</text><text class="km-xs" x="30" y="249" text-anchor="start">• ចន្លោះខ្សែវណ្ឌថេរលើផែនទីតែមួយ</text><text class="km-xs" x="30" y="266" text-anchor="start">• ខ្សែជិតគ្នា = ចោត · ឆ្ងាយគ្នា = រាប</text><text class="km-xs" x="30" y="283" text-anchor="start">• ខ្សែគោល (index) ក្រាស់ និងមានលេខកម្ពស់</text></svg>
