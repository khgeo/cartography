<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="Battambang, Siemreap, sans-serif"><rect width="1000" height="500" fill="#ffffff"/><text x="24.0" y="38.0" font-size="24" fill="#283593" text-anchor="start" font-weight="bold" class="ftitle">ផែនទីជម្រាល ពីទិន្នន័យកម្ពស់</text><image href="../assets/img/slides/l05-slope.png" x="60" y="80" width="400" height="400"/><text x="520.0" y="130.0" font-size="15" fill="#263238" text-anchor="start" font-weight="bold" >ជម្រាល (ដឺក្រេ)</text><rect x="520.0" y="140.0" width="26.0" height="18.0" rx="0" fill="#ffffcc" stroke="#999" stroke-width="0.6" /><text x="554.0" y="154.0" font-size="14" fill="#263238" text-anchor="start" font-weight="normal" >&lt; ២° រាប</text><rect x="520.0" y="164.0" width="26.0" height="18.0" rx="0" fill="#a1dab4" stroke="#999" stroke-width="0.6" /><text x="554.0" y="178.0" font-size="14" fill="#263238" text-anchor="start" font-weight="normal" >២–៥°</text><rect x="520.0" y="188.0" width="26.0" height="18.0" rx="0" fill="#41b6c4" stroke="#999" stroke-width="0.6" /><text x="554.0" y="202.0" font-size="14" fill="#263238" text-anchor="start" font-weight="normal" >៥–១០°</text><rect x="520.0" y="212.0" width="26.0" height="18.0" rx="0" fill="#2c7fb8" stroke="#999" stroke-width="0.6" /><text x="554.0" y="226.0" font-size="14" fill="#263238" text-anchor="start" font-weight="normal" >១០–២០°</text><rect x="520.0" y="236.0" width="26.0" height="18.0" rx="0" fill="#253494" stroke="#999" stroke-width="0.6" /><text x="554.0" y="250.0" font-size="14" fill="#263238" text-anchor="start" font-weight="normal" >&gt; ២០° ចោត</text><text x="520.0" y="330.0" font-size="16" fill="#263238" text-anchor="start" font-weight="normal" >ជម្រាល = arctan(Δកម្ពស់ ÷ ចម្ងាយផ្ដេក)</text><text x="520.0" y="360.0" font-size="16" fill="#607d8b" text-anchor="start" font-weight="normal" >ឧ. ឡើង ២០ ម ក្នុង ២០០ ម = ១០% ≈ ៥,៧°</text></svg>