<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" role="img" class="km-fig"><style>.km-fig{width:100%;height:auto}.km-fig text{font-family:var(--km-stack,'Battambang',sans-serif);fill:var(--md-default-fg-color,#222)}.km-t{font-size:15px;font-weight:700}.km-s{font-size:12.5px}.km-xs{font-size:11px}.km-box{fill:none;stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.5}.km-hdr{fill:var(--md-primary-fg-color,#00897b);opacity:.14}.km-line{stroke:var(--md-primary-fg-color,#00897b);stroke-width:1.4;stroke-dasharray:4 3;fill:none}.km-pt{fill:var(--md-primary-fg-color,#00897b)}.km-land{fill:var(--md-default-fg-color--lightest,#eee)}.km-arr{stroke:var(--md-default-fg-color--light,#666);stroke-width:1.6;fill:none;marker-end:url(#ah)}.km-ok{fill:#2e7d32}.km-bad{fill:#c62828}.km-mono{font-family:monospace!important;font-size:11.5px}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#777"/></marker></defs><text class="km-t" x="20" y="24" text-anchor="start">វិមាត្របីនៃពណ៌</text><text class="km-s" x="20" y="76" text-anchor="start">ពណ៌ (Hue)</text><rect class="" x="215" y="50" width="58" height="40" rx="3" style="fill:#e41a1c;stroke:#ccc"/><rect class="" x="277" y="50" width="58" height="40" rx="3" style="fill:#ff7f00;stroke:#ccc"/><rect class="" x="339" y="50" width="58" height="40" rx="3" style="fill:#ffd400;stroke:#ccc"/><rect class="" x="401" y="50" width="58" height="40" rx="3" style="fill:#4daf4a;stroke:#ccc"/><rect class="" x="463" y="50" width="58" height="40" rx="3" style="fill:#377eb8;stroke:#ccc"/><rect class="" x="525" y="50" width="58" height="40" rx="3" style="fill:#984ea3;stroke:#ccc"/><text class="km-s" x="20" y="138" text-anchor="start">តម្លៃពន្លឺ (Value)</text><rect class="" x="215" y="112" width="58" height="40" rx="3" style="fill:#f7fbff;stroke:#ccc"/><rect class="" x="277" y="112" width="58" height="40" rx="3" style="fill:#c6dbef;stroke:#ccc"/><rect class="" x="339" y="112" width="58" height="40" rx="3" style="fill:#9ecae1;stroke:#ccc"/><rect class="" x="401" y="112" width="58" height="40" rx="3" style="fill:#4292c6;stroke:#ccc"/><rect class="" x="463" y="112" width="58" height="40" rx="3" style="fill:#2171b5;stroke:#ccc"/><rect class="" x="525" y="112" width="58" height="40" rx="3" style="fill:#08306b;stroke:#ccc"/><text class="km-s" x="20" y="200" text-anchor="start">ភាពឆ្អែត (Saturation)</text><rect class="" x="215" y="174" width="58" height="40" rx="3" style="fill:#e8eaf6;stroke:#ccc"/><rect class="" x="277" y="174" width="58" height="40" rx="3" style="fill:#c5cae9;stroke:#ccc"/><rect class="" x="339" y="174" width="58" height="40" rx="3" style="fill:#9fa8da;stroke:#ccc"/><rect class="" x="401" y="174" width="58" height="40" rx="3" style="fill:#7986cb;stroke:#ccc"/><rect class="" x="463" y="174" width="58" height="40" rx="3" style="fill:#5c6bc0;stroke:#ccc"/><rect class="" x="525" y="174" width="58" height="40" rx="3" style="fill:#3949ab;stroke:#ccc"/><text class="km-s" x="20" y="246" text-anchor="start">ពណ៌បង្ហាញ «ខុសគ្នា» · តម្លៃពន្លឺ និងភាពឆ្អែតបង្ហាញ «ច្រើន ឬតិច»</text></svg>
