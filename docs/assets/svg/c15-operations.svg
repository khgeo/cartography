<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" class="km-fig"><style>.km-fig{width:100%;height:auto}.km-fig text{font-family:var(--km-stack,'Battambang',sans-serif);fill:var(--md-default-fg-color,#222)}.km-t{font-size:15px;font-weight:700}.km-s{font-size:12.5px}.km-xs{font-size:11px}.km-box{fill:none;stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.5}.km-hdr{fill:var(--md-primary-fg-color,#00897b);opacity:.14}.km-line{stroke:var(--md-primary-fg-color,#00897b);stroke-width:1.4;stroke-dasharray:4 3;fill:none}.km-pt{fill:var(--md-primary-fg-color,#00897b)}.km-land{fill:var(--md-default-fg-color--lightest,#eee)}.km-arr{stroke:var(--md-default-fg-color--light,#666);stroke-width:1.6;fill:none;marker-end:url(#ah)}.km-ok{fill:#2e7d32}.km-bad{fill:#c62828}.km-mono{font-family:monospace!important;font-size:11.5px}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#777"/></marker></defs><rect class="" x="20" y="30" width="230" height="96" rx="6" style="fill:#fafafa;stroke:#e0e0e0"/><text class="km-s" x="32" y="52" text-anchor="start" font-weight="700">ជ្រើសរើស (Selection)</text><text class="km-xs" x="32" y="72" text-anchor="start">លុបស្រទាប់ ឬវត្ថុដែលមិនចាំបាច់</text><circle cx="50" cy="100" r="4" fill="#26a69a" stroke="none" stroke-width="1.5" opacity="1"/><circle cx="72" cy="100" r="4" fill="#e0e0e0" stroke="none" stroke-width="1.5" opacity="1"/><circle cx="94" cy="100" r="4" fill="#26a69a" stroke="none" stroke-width="1.5" opacity="1"/><circle cx="116" cy="100" r="4" fill="#e0e0e0" stroke="none" stroke-width="1.5" opacity="1"/><circle cx="138" cy="100" r="4" fill="#26a69a" stroke="none" stroke-width="1.5" opacity="1"/><circle cx="160" cy="100" r="4" fill="#e0e0e0" stroke="none" stroke-width="1.5" opacity="1"/><rect class="" x="270" y="30" width="230" height="96" rx="6" style="fill:#fafafa;stroke:#e0e0e0"/><text class="km-s" x="282" y="52" text-anchor="start" font-weight="700">ធ្វើឲ្យសាមញ្ញ (Simplification)</text><text class="km-xs" x="282" y="72" text-anchor="start">កាត់បន្ថយចំណុចកំពូល</text><path d="M290 105 C320 85 340 118 370 95 S420 110 470 92" fill="none" stroke="#bdbdbd" stroke-width="2" opacity="1"/><path d="M290 105 L370 95 L470 92" fill="none" stroke="#26a69a" stroke-width="2" opacity="1"/><rect class="" x="520" y="30" width="230" height="96" rx="6" style="fill:#fafafa;stroke:#e0e0e0"/><text class="km-s" x="532" y="52" text-anchor="start" font-weight="700">រួមបញ្ចូល (Aggregation)</text><text class="km-xs" x="532" y="72" text-anchor="start">ផ្ទះច្រើន → តំបន់ទីក្រុងមួយ</text><rect class="" x="540" y="94" width="8" height="8" rx="1" style="fill:#bdbdbd"/><rect class="" x="552" y="94" width="8" height="8" rx="1" style="fill:#bdbdbd"/><rect class="" x="564" y="94" width="8" height="8" rx="1" style="fill:#bdbdbd"/><rect class="" x="576" y="94" width="8" height="8" rx="1" style="fill:#bdbdbd"/><rect class="" x="588" y="94" width="8" height="8" rx="1" style="fill:#bdbdbd"/><rect class="" x="600" y="94" width="8" height="8" rx="1" style="fill:#bdbdbd"/><rect class="" x="640" y="90" width="70" height="16" rx="3" style="fill:#26a69a;opacity:0.5"/><rect class="" x="20" y="150" width="230" height="96" rx="6" style="fill:#fafafa;stroke:#e0e0e0"/><text class="km-s" x="32" y="172" text-anchor="start" font-weight="700">បង្រួម (Collapse)</text><text class="km-xs" x="32" y="192" text-anchor="start">ទីក្រុងជាផ្ទៃ → ចំណុច</text><rect class="" x="40" y="210" width="50" height="18" rx="3" style="fill:#bdbdbd"/><text class="km-s" x="100" y="224" text-anchor="start">→</text><circle cx="140" cy="219" r="6" fill="#26a69a" stroke="none" stroke-width="1.5" opacity="1"/><rect class="" x="270" y="150" width="230" height="96" rx="6" style="fill:#fafafa;stroke:#e0e0e0"/><text class="km-s" x="282" y="172" text-anchor="start" font-weight="700">បំផ្លើស (Exaggeration)</text><text class="km-xs" x="282" y="192" text-anchor="start">ផ្លូវតូចដែលសំខាន់ គូរធំជាងមាត្រដ្ឋាន</text><path d="M290 220 L470 220" fill="none" stroke="#bdbdbd" stroke-width="1" opacity="1"/><path d="M290 232 L470 232" fill="none" stroke="#26a69a" stroke-width="3.5" opacity="1"/><rect class="" x="520" y="150" width="230" height="96" rx="6" style="fill:#fafafa;stroke:#e0e0e0"/><text class="km-s" x="532" y="172" text-anchor="start" font-weight="700">រំកិល (Displacement)</text><text class="km-xs" x="532" y="192" text-anchor="start">រំកិលវត្ថុបន្តិច ដើម្បីកុំជាន់គ្នា</text><path d="M540 218 L720 218" fill="none" stroke="#bdbdbd" stroke-width="3" opacity="1"/><path d="M540 226 L720 226" fill="none" stroke="#26a69a" stroke-width="3" opacity="1"/></svg>
