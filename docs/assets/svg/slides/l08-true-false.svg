<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Battambang, Siemreap, sans-serif"><rect width="1000" height="470" fill="#ffffff"/><text x="24.0" y="38.0" font-size="24" fill="#283593" text-anchor="start" font-weight="bold" class="ftitle">ពណ៌ពិត ធៀបនឹងពណ៌សន្មត</text><text x="24.0" y="64.0" font-size="15" fill="#607d8b" text-anchor="start" font-weight="normal" class="fsub">ពណ៌នៅលើផែនទី និងរូបភាព គឺជាការសម្រេចចិត្ត</text><image href="../assets/img/slides/l08-truecolour.jpg" x="60" y="90" width="380" height="330"/><image href="../assets/img/slides/l08-falsecolour.jpg" x="560" y="90" width="380" height="330"/><text x="250.0" y="450.0" font-size="16" fill="#283593" text-anchor="middle" font-weight="bold" >ពណ៌ពិត (ក្រហម–បៃតង–ខៀវ)</text><text x="750.0" y="450.0" font-size="16" fill="#283593" text-anchor="middle" font-weight="bold" >ពណ៌សន្មត៖ រុក្ខជាតិ = ក្រហម</text></svg>