<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="Battambang, Siemreap, sans-serif"><rect width="1000" height="540" fill="#ffffff"/><text x="24.0" y="38.0" font-size="24" fill="#283593" text-anchor="start" font-weight="bold" class="ftitle">រូបភាពផ្កាយរណប ធៀបនឹងផែនទី</text><text x="24.0" y="64.0" font-size="15" fill="#607d8b" text-anchor="start" font-weight="normal" class="fsub">ចំណុចប្រសព្វទន្លេចតុមុខ ភ្នំពេញ · Landsat 8 · ២០១៩</text><image href="../assets/img/slides/l01-landsat-pp.jpg" x="40" y="80" width="420" height="420"/><image href="../assets/img/slides/l01-landcover-pp.png" x="540" y="80" width="420" height="420"/><text x="250.0" y="525.0" font-size="15" fill="#263238" text-anchor="middle" font-weight="normal" >រូបភាព៖ អ្វីៗទាំងអស់ដែលឧបករណ៍ឃើញ</text><text x="750.0" y="525.0" font-size="15" fill="#263238" text-anchor="middle" font-weight="normal" >ផែនទី៖ ជ្រើសរើស ចាត់ថ្នាក់ និងធ្វើនិមិត្តសញ្ញា</text><text x="984.0" y="528.0" font-size="12" fill="#90a4ae" text-anchor="end" font-weight="normal" >Landsat 8 OLI ពី USGS · ផែនទីគម្របដីជាគំរូបង្រៀន</text></svg>