<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="Battambang, Siemreap, sans-serif"><rect width="1000" height="380" fill="#ffffff"/><text x="24.0" y="38.0" font-size="24" fill="#283593" text-anchor="start" font-weight="bold" class="ftitle">ប្រភាគតំណាង ១ : ៥០ ០០០ មានន័យអ្វី?</text><rect x="80.0" y="130.0" width="380.0" height="60.0" rx="0" fill="#fff8e1" stroke="#ffb300" stroke-width="2" /><text x="270.0" y="170.0" font-size="22" fill="#263238" text-anchor="middle" font-weight="bold" >១ សម លើផែនទី</text><text x="500.0" y="170.0" font-size="34" fill="#e65100" text-anchor="middle" font-weight="bold" >=</text><rect x="540.0" y="130.0" width="380.0" height="60.0" rx="0" fill="#e8eaf6" stroke="#283593" stroke-width="2" /><text x="730.0" y="170.0" font-size="22" fill="#263238" text-anchor="middle" font-weight="bold" >៥០ ០០០ សម = ៥០០ ម លើដី</text><text x="500.0" y="260.0" font-size="22" fill="#283593" text-anchor="middle" font-weight="normal" >៤ សម លើផែនទី × ៥០ ០០០ = ២០០ ០០០ សម = ២ គម</text><text x="500.0" y="310.0" font-size="18" fill="#607d8b" text-anchor="middle" font-weight="normal" >ផ្ទៃ៖ ១ សម² លើផែនទី = (៥០០ ម)² = ២៥០ ០០០ ម² = ០,២៥ គម²</text></svg>