<svg viewBox="0 0 760 200" xmlns="http://www.w3.org/2000/svg" role="img" class="km-fig"><style>.km-fig{width:100%;height:auto}.km-fig text{font-family:var(--km-stack,'Battambang',sans-serif);fill:var(--md-default-fg-color,#222)}.km-t{font-size:15px;font-weight:700}.km-s{font-size:12.5px}.km-xs{font-size:11px}.km-box{fill:none;stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.5}.km-hdr{fill:var(--md-primary-fg-color,#00897b);opacity:.14}.km-line{stroke:var(--md-primary-fg-color,#00897b);stroke-width:1.4;stroke-dasharray:4 3;fill:none}.km-pt{fill:var(--md-primary-fg-color,#00897b)}.km-land{fill:var(--md-default-fg-color--lightest,#eee)}.km-arr{stroke:var(--md-default-fg-color--light,#666);stroke-width:1.6;fill:none;marker-end:url(#ah)}.km-ok{fill:#2e7d32}.km-bad{fill:#c62828}.km-mono{font-family:monospace!important;font-size:11.5px}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#777"/></marker></defs><rect class="km-box" x="8" y="40" width="98" height="70" rx="6"/><rect class="km-hdr" x="8" y="40" width="98" height="26" rx="6"/><text class="km-s" x="57.0" y="58" text-anchor="middle" font-weight="700">គោលបំណង</text><text class="km-xs" x="57.0" y="86" text-anchor="middle">សំណួរ អ្នកអាន</text><line class="km-arr" x1="107" y1="75" x2="115" y2="75"/><rect class="km-box" x="116" y="40" width="98" height="70" rx="6"/><rect class="km-hdr" x="116" y="40" width="98" height="26" rx="6"/><text class="km-s" x="165.0" y="58" text-anchor="middle" font-weight="700">ទិន្នន័យ</text><text class="km-xs" x="165.0" y="86" text-anchor="middle">ប្រភព គុណភាព</text><line class="km-arr" x1="215" y1="75" x2="223" y2="75"/><rect class="km-box" x="224" y="40" width="98" height="70" rx="6"/><rect class="km-hdr" x="224" y="40" width="98" height="26" rx="6"/><text class="km-s" x="273.0" y="58" text-anchor="middle" font-weight="700">ចំណោល មាត្រដ្ឋាន</text><text class="km-xs" x