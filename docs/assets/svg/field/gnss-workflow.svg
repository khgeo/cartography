<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">GNSS data workflow</title><desc id="d">Satellites transmit signals to a receiver, producing waypoints and tracks that join field attributes and are checked in QGIS.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3949ab"/></marker></defs><rect width="900" height="360" rx="18" fill="#f8fafc"/><g font-family="Battambang, sans-serif" text-anchor="middle"><g fill="#f59e0b" stroke="#92400e" stroke-width="2"><rect x="55" y="55" width="90" height="34"/><rect x="75" y="34" width="50" height="78" rx="8"/><path d="M30 38h45v68H30zM125 38h45v68h-45z" fill="#bfdbfe"/></g><path d="M100 120c70 30 110 75 150 130M100 120c125 0 190 50 270 130M100 120c170-20 260 25 390 130" fill="none" stroke="#0284c7" stroke-width="3" stroke-dasharray="8 7"/><g transform="translate(300 165)"><rect width="120" height="155" rx="18" fill="#334155"/><rect x="15" y="20" width="90" height="75" fill="#dbeafe"/><circle cx="60" cy="122" r="16" fill="#f8fafc"/><text x="60" y="-18" font-size="21">អ្នកទទួល</text></g><g transform="translate(485 175)"><circle cx="35" cy="35" r="11" fill="#d32f2f"/><path d="M35 46v38" stroke="#d32f2f" stroke-width="6"/><path d="M80 25q45 25 80 5t65 40" fill="none" stroke="#2e7d32" stroke-width="7"/><text x="110" y="120" font-size="20">Waypoint + Track</text></g><g transform="translate(730 165)"><rect width="135" height="145" rx="8" fill="#fff" stroke="#64748b"/><path d="M15 35h105M15 65h105M15 95h105" stroke="#94a3b8"/><text x="68" y="132" font-size="18">QGIS + QC</text></g><path d="M425 240h50M695 240h25" stroke="#3949ab" stroke-width="4" marker-end="url(#a)"/><text x="100" y="155" font-size="20">សញ្ញា + ពេល</text><text x="450" y="342" font-size="18">កូអរដោនេត្រូវភ្ជាប់ ID · attribute · time · accuracy · source</text></g></svg>
