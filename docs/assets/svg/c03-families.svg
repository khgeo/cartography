<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" role="img" class="km-fig"><style>.km-fig{width:100%;height:auto}.km-fig text{font-family:var(--km-stack,'Battambang',sans-serif);fill:var(--md-default-fg-color,#222)}.km-t{font-size:15px;font-weight:700}.km-s{font-size:12.5px}.km-xs{font-size:11px}.km-box{fill:none;stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.5}.km-hdr{fill:var(--md-primary-fg-color,#00897b);opacity:.14}.km-line{stroke:var(--md-primary-fg-color,#00897b);stroke-width:1.4;stroke-dasharray:4 3;fill:none}.km-pt{fill:var(--md-primary-fg-color,#00897b)}.km-land{fill:var(--md-default-fg-color--lightest,#eee)}.km-arr{stroke:var(--md-default-fg-color--light,#666);stroke-width:1.6;fill:none;marker-end:url(#ah)}.km-ok{fill:#2e7d32}.km-bad{fill:#c62828}.km-mono{font-family:monospace!important;font-size:11.5px}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#777"/></marker></defs><circle cx="130" cy="110" r="48" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" opacity="1"/><rect class="" x="80" y="40" width="100" height="140" rx="0" style="fill:rgba(255,193,7,.25);stroke:#f9a825"/><text class="km-s" x="130" y="205" text-anchor="middle" font-weight="700">ស៊ីឡាំង (Cylindrical)</text><text class="km-xs" x="130" y="225" text-anchor="middle">Mercator · UTM</text><text class="km-xs" x="130" y="243" text-anchor="middle">ឧត្តមសម្រាប់តំបន់ជិតអេក្វាទ័រ</text><circle cx="380" cy="110" r="48" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" opacity="1"/><path d="M380 15 L310 150 L450 150Z" fill="rgba(255,193,7,.25)" stroke="#f9a825" stroke-width="1.5" opacity="1"/><text class="km-s" x="380" y="205" text-anchor="middle" font-weight="700">កោណ (Conic)</text><text class="km-xs" x="380" y="225" text-anchor="middle">Lambert Conformal Conic · Albers</text><text class="km-xs" x="380" y="243" text-anchor="middle">ឧត្តមសម្រាប់រយៈទទឹងមធ្យម</text><circle cx="630" cy="110" r="48" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" opacity="1"/><path d="M550 62 L710 62" fill="none" stroke="#f9a825" stroke-width="5" opacity="1"/><text class="km-s" x="630" y="205" text-anchor="middle" font-weight="700">ផ្ទៃរាបស្មើ (Azimuthal)</text><text class="km-xs" x="630" y="225" text-anchor="middle">Stereographic · Orthographic</text><text class="km-xs" x="630" y="243" text-anchor="middle">ឧត្តមសម្រាប់តំបន់ប៉ូល ឬកណ្ដាលចំណុចមួយ</text></svg>
