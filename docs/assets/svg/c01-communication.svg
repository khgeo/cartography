<svg viewBox="0 0 760 210" xmlns="http://www.w3.org/2000/svg" role="img" class="km-fig"><style>.km-fig{width:100%;height:auto}.km-fig text{font-family:var(--km-stack,'Battambang',sans-serif);fill:var(--md-default-fg-color,#222)}.km-t{font-size:15px;font-weight:700}.km-s{font-size:12.5px}.km-xs{font-size:11px}.km-box{fill:none;stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.5}.km-hdr{fill:var(--md-primary-fg-color,#00897b);opacity:.14}.km-line{stroke:var(--md-primary-fg-color,#00897b);stroke-width:1.4;stroke-dasharray:4 3;fill:none}.km-pt{fill:var(--md-primary-fg-color,#00897b)}.km-land{fill:var(--md-default-fg-color--lightest,#eee)}.km-arr{stroke:var(--md-default-fg-color--light,#666);stroke-width:1.6;fill:none;marker-end:url(#ah)}.km-ok{fill:#2e7d32}.km-bad{fill:#c62828}.km-mono{font-family:monospace!important;font-size:11.5px}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#777"/></marker></defs><rect class="km-box" x="10" y="40" width="130" height="70" rx="6"/><rect class="km-hdr" x="10" y="40" width="130" height="26" rx="6"/><text class="km-s" x="75.0" y="58" text-anchor="middle" font-weight="700">ពិភពពិត</text><text class="km-xs" x="75.0" y="86" text-anchor="middle">ភូមិ ទឹកជំនន់ ផ្លូវ</text><line class="km-arr" x1="142" y1="75" x2="160" y2="75"/><rect class="km-box" x="162" y="40" width="130" height="70" rx="6"/><rect class="km-hdr" x="162" y="40" width="130" height="26" rx="6"/><text class="km-s" x="227.0" y="58" text-anchor="middle" font-weight="700">អ្នកធ្វើផែនទី</text><text class="km-xs" x="227.0" y="86" text-anchor="middle">គោលបំណង ចំណេះដឹង</text><line class="km-arr" x1="294" y1="75" x2="312" y2="75"/><rect class="km-box" x="314" y="40" width="130" height="70" rx="6"/><rect class="km-hdr" x="314" y="40" width="130" height="26" rx="6"/><text class="km-s" x="379.0" y="58" text-anchor="middle" font-weight="700">ផែនទី</text><text class="km-xs" x="379.0" y="86" text-anchor="middle">និមិត្តសញ្ញា ពណ៌ អក្សរ</text><line class="km-arr" x1="446" y1="75" x2="464" y2="75"/><rect class="km-box" x="466" y="40" width="130" height="70" rx="6"/><rect class="km-hdr" x="466" y="40" width="130" height="26" rx="6"/><text class="km-s" x="531.0" y="58" text-anchor="middle" font-weight="700">អ្នកអាន</text><text class="km-xs" x="531.0" y="86" text-anchor="middle">បទពិសោធន៍ វប្បធម៌</text><line class="km-arr" x1="598" y1="75" x2="616" y2="75"/><rect class="km-box" x="618" y="40" width="130" height="70" rx="6"/><rect class="km-hdr" x="618" y="40" width="130" height="26" rx="6"/><text class="km-s" x="683.0" y="58" text-anchor="middle" font-weight="700">រូបភាពក្នុងគំនិត</text><text class="km-xs" x="683.0" y="86" text-anchor="middle">ការយល់ និងការសម្រេចចិត្ត</text><text class="km-xs" x="157" y="132" text-anchor="middle" style="fill:#e65100">តម្រងទី១</text><text class="km-xs" x="461" y="132" text-anchor="middle" style="fill:#e65100">តម្រងទី២</text><path d="M680 115 C640 190 140 190 75 115" fill="none" stroke="#9e9e9e" stroke-width="1.6" opacity="1" stroke-dasharray="6 4"/><text class="km-xs" x="380" y="200" text-anchor="middle">ប្រតិកម្ម៖ សាកល្បងផែនទីជាមួយអ្នកអាន ហើយកែរចនា</text></svg>
