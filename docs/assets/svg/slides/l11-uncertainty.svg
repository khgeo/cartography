<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Battambang, Siemreap, sans-serif"><rect width="1000" height="440" fill="#ffffff"/><text x="24.0" y="38.0" font-size="24" fill="#283593" text-anchor="start" font-weight="bold" class="ftitle">ភាពមិនច្បាស់៖ ចម្ងាយទៅស្ថានីយជិតបំផុត</text><image href="../assets/img/slides/l11-grid-5.png" x="60.0" y="90.0" width="335.6" height="279.7" preserveAspectRatio="none"/><circle cx="104.0" cy="156.0" r="4.00" fill="#c62828" stroke="#fff" stroke-width="1" opacity="1"/><circle cx="148.0" cy="222.0" r="4.00" fill="#c62828" stroke="#fff" stroke-width="1" opacity="1"/><circle cx="214.0" cy="189.0" r="4.00" fill="#c62828" stroke="#fff" stroke-width="1" opacity="1"/><circle cx="280.0" cy="156.0" r="4.00" fill="#c62828" stroke="#fff" stroke-width="1" opacity="1"/><circle cx="335.0" cy="211.0" r="4.00" fill="#c62828" stroke="#fff" stroke-width="1" opacity="1"/><circle cx="192.0" cy="288.0" r="4.00" fill="#c62828" stroke="#fff" stroke-width="1" opacity="1"/><circle cx="258.0" cy="277.0" r="4.00" fill="#c62828" stroke="#fff" stroke-width="1" opacity="1"/><circle cx="313.0" cy="310.0" r="4.00" fill="#c62828" stroke="#fff" stroke-width="1" opacity="1"/><circle cx="126.0" cy="310.0" r="4.00" fill="#c62828" stroke="#fff" stroke-width="1" opacity="1"/><circle cx="225.0" cy="343.0" r="4.00" fill="#c62828" stroke="#fff" stroke-width="1" opacity="1"/><circle cx="170.0" cy="189.0" r="4.00" fill="#c62828" stroke="#fff" stroke-width="1" opacity="1"/><circle cx="291.0" cy="244.0" r="4.00" fill="#c62828" stroke="#fff" stroke-width="1" opacity="1"/><text x="470.0" y="170.0" font-size="18" fill="#263238" text-anchor="start" font-weight="normal" >ពណ៌ភ្លឺ = ឆ្ងាយពីស្ថានីយ</text><text x="470.0" y="205.0" font-size="18" fill="#c62828" text-anchor="start" font-weight="bold" >→ តម្លៃអន្តរប៉ូលមិនសូវទុកចិត្ត</text><text x="470.0" y="260.0" font-size="17" fill="#283593" text-anchor="start" font-weight="bold" >បង្ហាញភាពមិនច្បាស់ដោយ៖</text><t