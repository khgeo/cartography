<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Battambang, Siemreap, sans-serif"><rect width="1000" height="400" fill="#ffffff"/><text x="24.0" y="38.0" font-size="24" fill="#283593" text-anchor="start" font-weight="bold" class="ftitle">អ្នកអានប៉ាន់ទំហំរង្វង់តិចជាងការពិត</text><text x="24.0" y="64.0" font-size="15" fill="#607d8b" text-anchor="start" font-weight="normal" class="fsub">តម្លៃ A ធំជាង B ១០ ដង</text><circle cx="250.0" cy="230.0" r="20.00" fill="#90caf9" stroke="#1565c0" stroke-width="1" opacity="1"/><circle cx="450.0" cy="230.0" r="63.00" fill="#90caf9" stroke="#1565c0" stroke-width="1" opacity="1"/><text x="250.0" y="330.0" font-size="16" fill="#263238" text-anchor="middle" font-weight="normal" >B = ១០</text><text x="450.0" y="330.0" font-size="16" fill="#263238" text-anchor="middle" font-weight="normal" >A = ១០០</text><text x="620.0" y="180.0" font-size="17" fill="#263238" text-anchor="start" font-weight="normal" >អ្នកអានភាគច្រើនប៉ាន់ថា A</text><text x="620.0" y="210.0" font-size="17" fill="#c62828" text-anchor="start" font-weight="bold" >ធំជាង B ប្រហែល ៦–៧ ដង</text><text x="620.0" y="260.0" font-size="17" fill="#283593" text-anchor="start" font-weight="normal" >Flannery៖ កាំ ∝ តម្លៃ^០,៥៧</text><text x="620.0" y="290.0" font-size="15" fill="#607d8b" text-anchor="start" font-weight="normal" >ដើម្បីប៉ះប៉ូវការយល់ឃើញ</text></svg>