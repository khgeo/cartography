chor="middle" style="fill:#5c6bc0">១៣–១៤</text><text class="km-xs" x="705" y="135" text-anchor="middle" style="fill:#5c6bc0">១៥</text><text class="km-xs" x="380" y="175" text-anchor="middle">លេខខាងក្រោម = មេរៀនក្នុងសៀវភៅនេះ ដែលសិក្សាជំហាននីមួយៗ</text></svg>
